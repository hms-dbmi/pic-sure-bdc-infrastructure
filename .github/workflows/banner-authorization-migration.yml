name: Banner authorization migration

on:
  push:
    branches: [main]
    paths:
      - 'app-infrastructure/db/bdc/auth/V25__Add_Banner_Management_Access_Rule.sql'
      - 'app-infrastructure/db/bdc/auth/V26__Expand_Banner_Management_Access_Rule.sql'
      - 'app-infrastructure/db/bdc/auth/V27__Authorize_Banner_Reorder.sql'
      - 'app-infrastructure/db/aim-ahead/auth/V27__Add_Banner_Management_Access_Rule.sql'
      - 'app-infrastructure/db/bdc/auth/V28__Allow_Banner_Disable_Route.sql'
      - 'app-infrastructure/db/aim-ahead/auth/V28__Expand_Banner_Management_Access_Rule.sql'
      - 'app-infrastructure/db/aim-ahead/auth/V29__Authorize_Banner_Reorder.sql'
      - 'app-infrastructure/db/bdc/auth/V29__Allow_Banner_Archive_Route.sql'
      - 'app-infrastructure/db/aim-ahead/auth/V30__Allow_Banner_Disable_Route.sql'
      - 'app-infrastructure/db/aim-ahead/auth/V31__Allow_Banner_Archive_Route.sql'
      - 'app-infrastructure/db/bdc/auth/V30__Allow_Banner_Restore_Route.sql'
      - 'app-infrastructure/db/aim-ahead/auth/V32__Allow_Banner_Restore_Route.sql'
      - 'tests/banner-authorization-migration/**'
      - '.github/workflows/banner-authorization-migration.yml'
  pull_request:
    paths:
      - 'app-infrastructure/db/bdc/auth/V25__Add_Banner_Management_Access_Rule.sql'
      - 'app-infrastructure/db/bdc/auth/V26__Expand_Banner_Management_Access_Rule.sql'
      - 'app-infrastructure/db/bdc/auth/V27__Authorize_Banner_Reorder.sql'
      - 'app-infrastructure/db/aim-ahead/auth/V27__Add_Banner_Management_Access_Rule.sql'
      - 'app-infrastructure/db/bdc/auth/V28__Allow_Banner_Disable_Route.sql'
      - 'app-infrastructure/db/aim-ahead/auth/V28__Expand_Banner_Management_Access_Rule.sql'
      - 'app-infrastructure/db/aim-ahead/auth/V29__Authorize_Banner_Reorder.sql'
      - 'app-infrastructure/db/bdc/auth/V29__Allow_Banner_Archive_Route.sql'
      - 'app-infrastructure/db/aim-ahead/auth/V30__Allow_Banner_Disable_Route.sql'
      - 'app-infrastructure/db/aim-ahead/auth/V31__Allow_Banner_Archive_Route.sql'
      - 'app-infrastructure/db/bdc/auth/V30__Allow_Banner_Restore_Route.sql'
      - 'app-infrastructure/db/aim-ahead/auth/V32__Allow_Banner_Restore_Route.sql'
      - 'tests/banner-authorization-migration/**'
      - '.github/workflows/banner-authorization-migration.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run actual BDC and AIM authorization migrations on MySQL 8
        run: tests/banner-authorization-migration/test.sh
