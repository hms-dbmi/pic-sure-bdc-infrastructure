Listen 0.0.0.0:443

##
##  SSL Global Context
##
##  All SSL configuration in this context applies both to
##  the main server and all SSL-enabled virtual hosts.
##

#
#   Some MIME-types for downloading Certificates and CRLs
#
AddType application/x-x509-ca-cert .crt
AddType application/x-pkcs7-crl    .crl

SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:AES128-GCM-SHA256:AES128-SHA256:AES256-GCM-SHA384:AES256-SHA256
SSLProxyCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA384:AES128-GCM-SHA256:AES128-SHA256:AES256-GCM-SHA384:AES256-SHA256

SSLHonorCipherOrder on

SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
SSLProxyProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
SSLPassPhraseDialog  builtin

SSLSessionCache        "shmcb:$${HTTPD_PREFIX}/logs/ssl_scache(512000)"
SSLSessionCacheTimeout  300

# Inert while a single *:443 vhost exists; enforces only if another is added.
SSLVHostSNIPolicy strict


Mutex  "file:$${HTTPD_PREFIX}/logs/ssl_mutex"

ServerTokens Prod

<VirtualHost *:80>
    RewriteEngine On
    ProxyPreserveHost Off

    # Dont allow httpd debug methods
    RewriteCond %%{REQUEST_METHOD} ^TRACK [NC,OR]
    RewriteCond %%{REQUEST_METHOD} ^TRACE [NC]
    RewriteRule .* - [F]

    # Logging proxy from localhost only
    RewriteCond %%{HTTP_HOST} ^(localhost|127\.0\.0\.1)(:[0-9]+)?$ [NC]
    RewriteRule ^/picsure/proxy/pic-sure-logging/(.*)$ "http://wildfly.${target_stack}.${env_private_dns_name}:8080/logging/$1" [P,L]

    # Other /picsure/ requests from localhost only
    RewriteCond %%{HTTP_HOST} ^(localhost|127\.0\.0\.1)(:[0-9]+)?$ [NC]
    RewriteRule ^/picsure/(.*)$ "http://wildfly.${target_stack}.${env_private_dns_name}:8080/$1" [P,L]

    RewriteRule ^ https://%%{SERVER_NAME}/ [L,NE,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName ${env_public_dns_name}
    ServerAlias ${env_public_dns_name_staging}
    SSLProxyEngine on
    SSLProxyCheckPeerCN off

    SSLCertificateFile "$${HTTPD_PREFIX}/cert/server.crt"
    SSLCertificateKeyFile "$${HTTPD_PREFIX}/cert/server.key"
    SSLCertificateChainFile "$${HTTPD_PREFIX}/cert/server.chain"

    Header always set Strict-Transport-Security "max-age=31536000; includeSubdomains; preload"

    # The frontend owns the CSP for HTML responses: dropping 'unsafe-inline' needs a
    # per-response nonce, and httpd cannot generate one that matches what SvelteKit renders
    # (see kit.csp in PIC-SURE-Frontend/svelte.config.js). What follows is the floor for
    # everything arriving WITHOUT a CSP - the JSON API, static assets, and httpd's own
    # redirects and error pages. The expr guard is load-bearing: without it this emits a
    # SECOND header, and browsers enforce the intersection, which would blank the app.
    # A JSON endpoint needs no script, style or frame source at all; sandbox additionally
    # drops a directly-navigated API response into an opaque origin so it cannot reach
    # cookies or browser storage. ALS-9583.
    Header always set Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; sandbox" "expr=-z %%{resp:Content-Security-Policy}"

    # httpd cannot remove the Server header - the core always emits the field - and it only
    # honours a replacement on PROXIED responses, which is all app and API traffic. The health
    # check, redirects and error pages still report "Apache", with no version (ServerTokens
    # Prod above, and baked into the image via httpd-picsure.conf). The awselb/2.0 banner on
    # the ALB's own WAF challenge responses is vendor-controlled and out of reach. ALS-9584.
    Header always set Server "PIC-SURE"

    # Attempt to prevent some MIME-type confusion attacks. There is no perfect solution to this problem.
    Header always set X-Content-Type-Options "nosniff"

    # A fall back for legacy browsers that don't yet support CSP frame-ancestors.
    Header always set X-Frame-Options "DENY"

    RewriteEngine On
    ProxyPreserveHost On

    #Dont allow httpd debug methods
    RewriteCond %%{REQUEST_METHOD} ^TRACK [NC,OR]
    RewriteCond %%{REQUEST_METHOD} ^TRACE [NC]
    RewriteRule .* - [F]

    # Match the request to /health and return a 200 OK status
    RewriteRule ^/picsure/health$ - [R=200,L]

    # Optional: reject unrecognised Host headers, which SSLVHostSNIPolicy cannot do
    # with one vhost. Must stay below the health rule. Check the ALB health check
    # path first - AWS probes send Host: <target-ip> and would get 421.
    # RewriteCond %%{HTTP_HOST} !^(${env_public_dns_name}|${env_public_dns_name_staging})(:[0-9]+)?$ [NC]
    # RewriteRule .* - [R=421,L]

    RewriteRule ^/picsure/(.*)$ "http://wildfly.${target_stack}.${env_private_dns_name}:8080/$1" [P]
    RewriteRule ^/psama/(.*)$ "http://wildfly.${target_stack}.${env_private_dns_name}:8090/auth/$1" [P]
    RewriteRule ^/psamaui/login/(.*)$ "http://localhost:3000/login/loading/$1" [P,QSA]
    RewriteRule ^/(.*)$ "http://localhost:3000/$1" [P]

    RewriteCond %%{DOCUMENT_ROOT}/%%{REQUEST_FILENAME} !-f
    RewriteCond %%{DOCUMENT_ROOT}/%%{REQUEST_FILENAME} !-d

    DocumentRoot "$${HTTPD_PREFIX}/htdocs"

    LogFormat "%%{X-Forwarded-For}i %t %%{SSL_PROTOCOL}x %%{SSL_CIPHER}x \"%r\" %b" proxy-ssl
    LogFormat "%h %l %u %t \"%r\" %>s %b \"%%{Referer}i\" \"%%{User-Agent}i\"" combined
    LogFormat "%%{X-Forwarded-For}i %l %u %t \"%r\" %>s %b \"%%{Referer}i\" \"%%{User-Agent}i\"" proxy
    SetEnvIf X-Forwarded-For "^.*\..*\..*\..*" forwarded
	RequestHeader set X-Forwarded-For "%%{REMOTE_ADDR}s" env=!forwarded
    CustomLog "$${HTTPD_PREFIX}/logs/access_log" combined env=!forwarded
    CustomLog "$${HTTPD_PREFIX}/logs/access_log" proxy env=forwarded
    CustomLog "$${HTTPD_PREFIX}/logs/ssl_request_log" proxy-ssl env=forwarded
    CustomLog "$${HTTPD_PREFIX}/logs/ssl_request_log" \
          "%t %h %%{SSL_PROTOCOL}x %%{SSL_CIPHER}x \"%r\" %b" env=!forwarded
    ErrorLog "$${HTTPD_PREFIX}/logs/error_log"
    TransferLog "$${HTTPD_PREFIX}/logs/access_log"

    BrowserMatch "MSIE [2-5]" \
         nokeepalive ssl-unclean-shutdown \
         downgrade-1.0 force-response-1.0

</VirtualHost>
